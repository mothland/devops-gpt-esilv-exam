name: CI/CD Workflow

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js version 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Lancer la commande npm install
        run: npm install

      - name: Lancer la commande npm test
        run: npm test

      - name: Simuler un déploiement
        if: startsWith(github.ref, 'refs/tags/')
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: echo "Déploiement en cours..."